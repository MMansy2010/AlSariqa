<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الهروب 2 | بروتوكول الإقلاع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">
    <canvas id="particle-canvas" aria-hidden="true"></canvas>

    <div class="ambient-orb orb-a"></div>
    <div class="ambient-orb orb-b"></div>
    <div class="hex-grid"></div>
    <div class="scanlines"></div>

    <div class="app-shell">
        <header class="top-bar">
            <div class="top-bar-block">
                <span class="pulse-dot"></span>
                <span>قناة مشفّرة · نشطة</span>
            </div>
            <div class="top-bar-block mission-tag">
                <i class="fas fa-layer-group"></i>
                <span>8 مراحل</span>
            </div>
            <div class="top-bar-block clock" id="live-time">00:00:00</div>
        </header>

        <main class="mission-card" id="welcome-card">
            <div class="card-frame frame-tl"></div>
            <div class="card-frame frame-tr"></div>
            <div class="card-frame frame-bl"></div>
            <div class="card-frame frame-br"></div>

            <div class="card-inner">
                <div class="edition-badge">
                    <span class="edition-num">02</span>
                    <span class="edition-label">الجزء الثاني</span>
                </div>

                <h1 class="hero-title" id="welcome-title">
                    <span class="title-line">غرفة الهروب</span>
                    <span class="title-accent" data-text="بروتوكول الإقلاع">بروتوكول الإقلاع</span>
                </h1>
                <p class="hero-sub">ثمانية أقفال. فريقان. مهمة واحدة — اكسر الشفرة قبل انتهاء الوقت.</p>

                <div class="stats-row">
                    <div class="stat-chip">
                        <i class="fas fa-clock"></i>
                        <span>90 دقيقة</span>
                    </div>
                    <div class="stat-chip">
                        <i class="fas fa-user-shield"></i>
                        <span>فريقان متوازيان</span>
                    </div>
                    <div class="stat-chip">
                        <i class="fas fa-bolt"></i>
                        <span>صعوبة أعلى</span>
                    </div>
                </div>

                <form id="welcome-form" onsubmit="return false;">
                    <div class="field">
                        <label for="player-name">
                            <i class="fas fa-id-card-clip"></i>
                            قائد الفريق
                        </label>
                        <div class="field-control">
                            <input type="text" id="player-name" placeholder="الاسم الرمزي للقائد..." autocomplete="off">
                            <span class="field-glow"></span>
                        </div>
                    </div>

                    <div class="field">
                        <label for="player-team">
                            <i class="fas fa-shield-halved"></i>
                            اختيار الفريق
                        </label>
                        <div class="team-picker" id="team-picker">
                            <button type="button" class="team-option" data-team="blue" aria-pressed="false">
                                <span class="team-dot blue"></span>
                                <span class="team-label">الفريق الأزرق</span>
                                <span class="team-code">ALPHA</span>
                            </button>
                            <button type="button" class="team-option" data-team="red" aria-pressed="false">
                                <span class="team-dot red"></span>
                                <span class="team-label">الفريق الأحمر</span>
                                <span class="team-code">OMEGA</span>
                            </button>
                        </div>
                        <input type="hidden" id="player-team" value="">
                    </div>

                    <div class="field members-field" id="team-members-group" hidden>
                        <label for="member-name-input">
                            <i class="fas fa-users"></i>
                            أعضاء الفريق
                        </label>
                        <div class="field-control add-row">
                            <input type="text" id="member-name-input" placeholder="اسم العضو ثم Enter أو +" autocomplete="off">
                            <button type="button" id="btn-add-member" class="btn-icon" title="إضافة عضو">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                        <div id="members-list-container" class="members-list"></div>
                    </div>

                    <button type="button" class="audio-pill" id="audio-toggle">
                        <i class="fas fa-volume-high" id="audio-icon"></i>
                        <span>المؤثرات الصوتية مفعّلة</span>
                    </button>

                    <button type="button" class="btn-launch" id="btn-start">
                        <span class="btn-launch-bg"></span>
                        <span class="btn-launch-content">
                            <i class="fas fa-rocket"></i>
                            إطلاق المهمة
                        </span>
                    </button>
                </form>
            </div>
        </main>

        <footer class="foot-note">
            <i class="fas fa-triangle-exclamation"></i>
            بمجرد الإطلاق يُقفل النظام ويبدأ العد التنازلي — لا رجوع بدون إعادة الجلسة.
        </footer>
    </div>

    <div class="toast" id="cyber-toast" role="alert">
        <div class="toast-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <div class="toast-text">
            <strong class="toast-title">فشل التحقق</strong>
            <p class="toast-desc" id="toast-message">أكمل البيانات المطلوبة.</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
